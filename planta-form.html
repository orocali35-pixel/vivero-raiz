<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Intranet - Formulario de Planta</title>
    
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    
    <header>
        <div class="logo-contenedor">
            <span>Vivero Raíz - Admin</span>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">⬅️ Sitio Público</a></li>
                <li><a href="listado.html">Listado de Plantas</a></li>
                <li><a href="planta-form.html">Cargar Planta</a></li>
            </ul>
        </nav>
    </header>

    <!-- Cuerpo principal -->
    <main>
        <section class="formulario-contenedor" style="max-width: 600px;">
            <h2>Gestión de Planta (Alta/Edición)</h2>
            <p>Introduce los datos técnicos para actualizar la información en la base de datos.</p>

            <form action="#" method="POST" class="mi-formulario">
                
                <div class="campo-grupo">
                    <label for="nombre">Nombre Común:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>

                <div class="campo-grupo">
                    <label for="nombreCientifico">Nombre Científico:</label>
                    <input type="text" id="nombreCientifico" name="nombreCientifico">
                </div>

                <div class="campo-grupo">
                    <label for="categoria">Categoría:</label>
                    <select id="categoria" name="categoria">
                        <option value="interior">Interior</option>
                        <option value="exterior">Exterior</option>
                        <option value="suculenta">Suculenta</option>
                        <option value="aromatica">Aromática</option>
                    </select>
                </div>

                <div class="campo-grupo">
                    <label>Requerimiento de Luz:</label>
                    <div class="campo-checkbox">
                        <input type="radio" id="sol" name="luz" value="sol pleno"> 
                        <label for="sol">Sol pleno</label>
                    </div>
                    <div class="campo-checkbox">
                        <input type="radio" id="media" name="luz" value="media sombra"> 
                        <label for="media">Media sombra</label>
                    </div>
                    <div class="campo-checkbox">
                        <input type="radio" id="sombra" name="luz" value="sombra"> 
                        <label for="sombra">Sombra</label>
                    </div>
                </div>

                <div class="campo-grupo">
                    <label for="riego">Nivel de Riego:</label>
                    <select id="riego" name="riego">
                        <option value="bajo">Bajo</option>
                        <option value="medio">Medio</option>
                        <option value="alto">Alto</option>
                    </select>
                </div>

                <div class="campo-grupo">
                    <label for="precio">Precio:</label>
                    <input type="number" id="precio" name="precio" step="0.01" required>
                </div>

                <div class="campo-grupo">
                    <label for="stock">Stock Disponible:</label>
                    <input type="number" id="stock" name="stock" required>
                </div>

                <div class="campo-grupo">
                    <label for="fechaIngreso">Fecha de Ingreso:</label>
                    <input type="date" id="fechaIngreso" name="fechaIngreso">
                </div>

                <div class="campo-grupo">
                    <label for="aptaMascotas">¿Es apta para Mascotas?:</label>
                    <select id="aptaMascotas" name="aptaMascotas">
                        <option value="si">Sí</option>
                        <option value="no">No</option>
                    </select>
                </div>

                <div class="campo-grupo">
                    <label>Etiquetas aplicables:</label>
                    <div class="campo-checkbox">
                        <input type="checkbox" id="purificadora" name="etiquetas" value="purificadora">
                        <label for="purificadora">Purificadora</label>
                    </div>
                    <div class="campo-checkbox">
                        <input type="checkbox" id="floracion" name="etiquetas" value="floracion">
                        <label for="floracion">Floración</label>
                    </div>
                    <div class="campo-checkbox">
                        <input type="checkbox" id="colgante" name="etiquetas" value="colgante">
                        <label for="colgante">Colgante</label>
                    </div>
                    <div class="campo-checkbox">
                        <input type="checkbox" id="resistente" name="etiquetas" value="resistente">
                        <label for="resistente">Resistente</label>
                    </div>
                </div>

                <div class="campo-grupo">
                    <label for="foto">URL de la Imagen (Foto):</label>
                    <input type="url" id="foto" name="foto" placeholder="https://ejemplo.com">
                </div>

                <div class="campo-grupo">
                    <label for="notes">Notas / Cuidados particulares:</label>
                    <textarea id="notes" name="notas" rows="4"></textarea>
                </div>

                <br>
                <div style="display: flex; gap: 15px; align-items: center;">
                    <button type="submit" class="btn-formulario" style="flex: 1;">Guardar Planta</button>
                    <a href="listado.html" style="color: #666; text-decoration: none; font-weight: bold;">Cancelar</a>
                </div>
            </form>
        </section>
    </main>

    <!-- Pie de página unificado -->
    <footer>
        <p>&copy; 2026 Vivero Raíz - Tecnicatura en Desarrollo de Software (ISTEA)</p>
    </footer>
    <script src="js/datos.js"></script>
<script src="js/api.js"></script>


</body>
</html>
