<<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Vivero Raíz - Registro</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    
    <header>
        <div class="logo-contenedor">
            <img src="img/logovivero.jpg" alt="Logo de Vivero Raíz" width="50">
            <span>Vivero Raíz</span>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="catalogo.html">Catálogo</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="login.html" class="btn-ingresar">Ingresar</a></li>
            </ul>
        </nav>
    </header>

    
    <main>
        <section class="formulario-contenedor">
            <h2>Crear Cuenta</h2>
            <p>Registrate para formar parte de la comunidad de Vivero Raíz.</p>

            <form action="#" method="POST" class="mi-formulario">
                
                
                <fieldset style="border: 1px solid #ccc; padding: 20px; border-radius: 5px;">
                    <legend style="padding: 0 10px; font-weight: bold; color: var(--verde-principal);">Datos de Usuario</legend>

                    <div class="campo-grupo" style="margin-bottom: 15px;">
                        <label for="username">Nombre de Usuario:</label>
                        <input type="text" id="username" name="username" required>
                    </div>

                    <div class="campo-grupo" style="margin-bottom: 15px;">
                        <label for="email">Correo Electrónico:</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="campo-grupo" style="margin-bottom: 15px;">
                        <label for="password">Contraseña:</label>
                        <input type="password" id="password" name="password" required>
                    </div>

                    <!-- Campo necesario para la Entrega 6 (Validaciones con JS) -->
                    <div class="campo-grupo" style="margin-bottom: 15px;">
                        <label for="confirm-password">Confirmar Contraseña:</label>
                        <input type="password" id="confirm-password" name="confirm-password" required>
                    </div>

                    
                    <div class="campo-checkbox" style="margin-bottom: 15px;">
                        <input type="checkbox" id="terminos" name="terminos" required>
                        <label for="terminos">Acepto los términos y condiciones del vivero</label>
                    </div>

                    <button type="submit" class="btn-formulario" style="width: 100%;">Registrarse</button>
                </fieldset>

            </form>
        </section>
    </main>

    
    <footer>
        <p>&copy; 2026 Vivero Raíz - Tecnicatura en Desarrollo de Software (ISTEA)</p>
    </footer>
    <script src="js/validaciones.js"></script>
<script src="js/auth.js"></script>


</body>
</html>
