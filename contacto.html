<<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Vivero Raíz - Contacto</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <!-- HEADER IDÉNTICO -->
    <header>
        <div class="logo-contenedor">
            <img src="img/logovivero.jpg" alt="Logo de Vivero Raíz" width="50">
            <span>Vivero Raíz</span>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="catalogo.html">Catálogo</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="login.html" class="btn-ingresar">Ingresar</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="formulario-contenedor">
            <h2>Contacto - Vivero Raíz</h2>
            <p>Dejanos tu consulta y te responderemos a la brevedad por correo electrónico.</p>
            
            <form action="#" method="POST" class="mi-formulario">
                <div class="campo-grupo">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>

                <div class="campo-grupo">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="campo-grupo">
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono">
                </div>

                <div class="campo-grupo">
                    <label for="motivo">Motivo de Consulta:</label>
                    <select id="motivo" name="motivo">
                        <option value="compras">Compras / Pedidos</option>
                        <option value="cuidados">Cuidado de Plantas</option>
                        <option value=" things">Otros Motivos</option>
                    </select>
                </div>

                <div class="campo-grupo">
                    <label for="mensaje">Tu Consulta:</label>
                    <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
                </div>

                <div class="campo-checkbox">
                    <input type="checkbox" id="novedades" name="novedades" checked>
                    <label for="novedades">Quiero recibir novedades y consejos del vivero</label>
                </div>

                <button type="submit" class="btn-formulario">Enviar Formulario</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Vivero Raíz - Tecnicatura en Desarrollo de Software (ISTEA)</p>
    </footer>
    <script src="js/validaciones.js"></script>
<script src="js/auth.js"></script>


</body>
</html>
